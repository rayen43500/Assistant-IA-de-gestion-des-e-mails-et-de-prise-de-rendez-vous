name: CI/CD Qualité ISO 25010

# Chaque couche de test du cahier des charges (§7) est exécutée par la même commande qu'en local :
#   node quality/run-all.js <couches>
# Aucun échec n'est masqué : un job rouge = une exigence non satisfaite.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.12'
  PYTHON: python

jobs:
  # ─── 1. Tests unitaires + intégration MongoDB + fiabilité + couverture (§6.1, §6.5, §6.7) ───
  unit:
    name: Tests unitaires, intégration et fiabilité
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7.0
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --prefix backend
      - run: node quality/run-all.js unit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapport-unit
          path: quality/reports/

  # ─── 2. Analyse statique, duplication, dépendances, service IA Python (§6.6 SAST/SCA, §6.7) ───
  static:
    name: SAST, SCA, maintenabilité, tests Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            quality/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ai-service/requirements-dev.txt
      - run: npm ci --prefix backend && npm ci --prefix frontend && npm ci --prefix quality
      - run: pip install -r ai-service/requirements-dev.txt
      - run: node quality/run-all.js python lint dup sca sast
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapport-statique
          path: quality/reports/

  # ─── 3. Application en marche : API, E2E multi-navigateurs, performance, DAST (§6.1–6.4, §6.6) ───
  runtime:
    name: API, E2E, performance, DAST (sondes + OWASP ZAP)
    runs-on: ubuntu-latest
    needs: [unit]
    services:
      mongo:
        image: mongo:7.0
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            quality/package-lock.json
      - run: npm ci --prefix backend && npm ci --prefix frontend && npm ci --prefix quality
      - name: Navigateurs Playwright (Chromium + Firefox)
        run: npx playwright install --with-deps chromium firefox
        working-directory: quality
      - run: node quality/run-all.js api e2e perf dast zap
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapport-runtime
          path: quality/reports/

  # ─── 4. Scan de vulnérabilités du dépôt (Trivy) (§6.6) ───
  trivy:
    name: Scan Trivy (dépendances et configuration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          skip-dirs: quality/node_modules
          exit-code: '1'
          format: table

  # ─── 5. Portabilité : installation reproductible par conteneurs (§6.8) ───
  portability:
    name: Portabilité (Docker Compose)
    runs-on: ubuntu-latest
    needs: [unit, static]
    env:
      JWT_SECRET: ci-jwt-secret-0123456789-abcdefghijklmnop
      INTERNAL_API_KEY: ci-internal-key-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: node quality/run-all.js portability
      - name: Démarrage réel de la pile et contrôle de santé
        run: |
          docker compose up -d mongo backend ai-service
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:5000/health | grep -q '"database":"UP"'; then echo "Backend + MongoDB opérationnels"; break; fi
            sleep 3
          done
          curl -fsS http://localhost:5000/health
          curl -fsS http://localhost:8000/health
      - if: always()
        run: docker compose logs --no-color > quality-compose.log 2>&1 || true
      - if: always()
        run: docker compose down -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapport-portabilite
          path: |
            quality/reports/
            quality-compose.log
