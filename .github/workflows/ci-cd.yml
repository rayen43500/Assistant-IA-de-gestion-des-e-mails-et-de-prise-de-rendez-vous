name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # 1. Validation & Tests Backend
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package.json
      - name: Install dependencies
        run: cd backend && npm ci
      - name: Run Backend Tests
        run: cd backend && npm test || true

  # 2. Validation & Tests AI Service
  ai-service-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          cd ai-service
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run AI Classification & Guardrails Tests
        run: |
          cd ai-service
          pytest -v || true

  # 3. DevSecOps Security Scans (Trivy & Dependency Check)
  security-scans:
    runs-on: ubuntu-latest
    needs: [backend-test, ai-service-test]
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner on Repo
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'

  # 4. Build des Conteneurs Docker
  docker-build:
    runs-on: ubuntu-latest
    needs: security-scans
    steps:
      - uses: actions/checkout@v4
      - name: Build Backend Docker Image
        run: docker build -t ai-cabinet/backend:latest ./backend
      - name: Build AI Service Docker Image
        run: docker build -t ai-cabinet/ai-service:latest ./ai-service
      - name: Build Frontend Docker Image
        run: docker build -t ai-cabinet/frontend:latest ./frontend
